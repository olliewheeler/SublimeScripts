name: "Detect specific URL in text attachment"
description: "Flags when an attachment contains a link to something.com"
type: "rule"
severity: "medium"

source: |
  length(
    filter(attachments,
      length(
        filter(file.explode(.).scan.url.urls,
          strings.icontains(.url, "something.com")
        )
      ) > 0
    )
  ) > 0
