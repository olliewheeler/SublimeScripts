name: "Attachment TXT Contains Suspicious URL"
description: "Detects txt attachments that contain a URL within the file pointing to a specific malicious domain."
type: "rule"
severity: "high"

source: |
  type.inbound
  and any(attachments, .file_extension == "txt" and any(file.explode(.), 
    any(.scan.url.urls, .domain.root_domain == "something.com")
  ))
